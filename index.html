<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 크리에이터 리소스 허브</title>
    <meta name="description" content="AI 콘텐츠 제작에 필요한 모든 리소스를 한곳에. 자동 수집, 한글 설명, 신선도 관리.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
    <!-- Header -->
    <header id="header">
        <div class="header-inner">
            <div class="logo">
                <h1>🚀 AI 크리에이터 리소스 허브</h1>
                <p class="subtitle">AI 콘텐츠 제작에 필요한 모든 것을 한곳에</p>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" title="테마 전환">🌙</button>
                <button id="login-btn" class="login-btn">
                    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                <span>Google 로그인</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Stats Bar -->
    <section id="stats-bar" class="stats-bar">
        <div class="stats-inner">
            <div class="stat-total">
                <span class="stat-number" id="total-count">0</span>
                <span class="stat-label">전체 리소스</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stats-categories" id="stats-categories">
                <!-- Dynamically populated -->
            </div>
        </div>
    </section>

    <!-- Category Tabs -->
    <nav id="category-tabs" class="category-tabs">
        <div class="tabs-inner">
            <button class="tab active" data-category="all">전체</button>
            <!-- Dynamically populated -->
        </div>
    </nav>

    <!-- Category Guide -->
    <div id="category-guide" class="category-guide" style="display:none">
        <span class="guide-icon">💡</span>
        <span class="guide-text" id="guide-text"></span>
    </div>

    <!-- Search & Filter Bar -->
    <section class="controls-bar">
        <div class="controls-inner">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="search-input" placeholder="검색어를 입력하세요... (제목, 설명, 태그)" autocomplete="off">
                <button id="search-clear" class="search-clear" style="display:none">✕</button>
            </div>
            <div class="controls-row">
                <div class="platform-filters" id="platform-filters">
                    <button class="pill active" data-platform="all">전체</button>
                    <button class="pill" data-platform="github"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> GitHub</button>
                    <button class="pill" data-platform="huggingface">🤗 HuggingFace</button>
                    <button class="pill" data-platform="arxiv">📄 arXiv</button>
                    <button class="pill" data-platform="hackernews">📰 HackerNews</button>
                    <button class="pill" data-platform="curated">✨ 큐레이션</button>
                </div>
                <div class="sort-area">
                    <select id="sort-select">
                        <option value="stars-desc">⭐ 인기순</option>
                        <option value="date-desc">🕐 최신순</option>
                        <option value="freshness-desc">🌿 신선도순</option>
                        <option value="title-asc">🔤 이름순</option>
                    </select>
                    <span class="result-count" id="result-count">결과: 0개</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <div id="card-grid" class="card-grid">
            <!-- Cards rendered by JS -->
        </div>
        <div id="empty-state" class="empty-state" style="display:none">
            <div class="empty-icon">📦</div>
            <h3 id="empty-title">데이터를 불러올 수 없습니다</h3>
            <p id="empty-desc">collector.py를 먼저 실행해주세요.</p>
        </div>
        <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>리소스를 불러오는 중...</p>
        </div>
    </main>

    <!-- Login Modal (placeholder) -->
    <div id="login-modal" class="modal" style="display:none">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>
            <h2>🔐 Google 로그인</h2>
            <p>로그인하면 즐겨찾기와 최근 본 기록을 저장할 수 있어요.</p>
            <button id="google-signin-btn" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Google 계정으로 로그인
            </button>
            <p class="modal-note">⚠️ Firebase 설정이 필요합니다. README를 참고하세요.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <p>🚀 AI 크리에이터 리소스 허브 v3.0</p>
            <p class="footer-sub">자동 업데이트: 매주 월요일 | <a href="https://github.com/jm-git-163/ai-resource-hub" target="_blank">GitHub</a></p>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
